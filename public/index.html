<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Company</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>AI Company</h1>
    <span id="status" class="status">確認中...</span>
  </header>

  <main>
    <label for="employee">担当者を選択</label>
    <select id="employee"></select>

    <div id="messages"></div>

    <form id="chat-form">
      <input id="message" type="text" placeholder="メッセージを入力..." autocomplete="off" required />
      <button type="submit">送信</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
